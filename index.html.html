<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residencial Francia - Panel administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --navy: #001f3f;
            --tab-inactive: #003366;
            --tab-active: #f8fafc;
        }
        body { background-color: #f0f2f5; overflow: hidden; height: 100vh; display: flex; flex-direction: column; margin: 0; font-family: 'Segoe UI', sans-serif; }
        
        /* Barra Superior Azul Marino */
        .navbar {
            background-color: var(--navy);
            height: 65px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            color: white;
            z-index: 50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo { height: 45px; margin-right: 15px; }
        .titles { display: flex; flex-direction: column; min-width: 220px; }
        .main-title { font-weight: 800; font-size: 1.2rem; letter-spacing: 0.5px; }
        .sub-title { font-size: 0.7rem; color: #93c5fd; text-transform: uppercase; font-weight: 600; }

        /* Contenedor de Pestañas Solapadas (De derecha a izquierda) */
        .tabs-container {
            display: flex;
            flex-grow: 1;
            justify-content: flex-end; /* Alinea los botones a la derecha */
            height: 100%;
            align-items: flex-end;
            padding-right: 10px;
            overflow: hidden;
        }

        .tab {
            background: var(--tab-inactive);
            color: #94a3b8;
            padding: 8px 35px;
            margin-right: -15px; /* Efecto solapado */
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            white-space: nowrap;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tab.active {
            background: var(--tab-active);
            color: var(--navy);
            z-index: 10;
            font-weight: bold;
            box-shadow: 0 -3px 10px rgba(0,0,0,0.3);
        }

        .tab:hover:not(.active) {
            background: #004a99;
            color: white;
            z-index: 5;
        }

        /* Iframe para visualizar las páginas */
        #content-frame { width: 100%; flex-grow: 1; border: none; background: #ffffff; }

        /* Modales */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .admin-box { background: white; border-radius: 15px; width: 100%; max-width: 700px; max-height: 85vh; overflow-y: auto; padding: 25px; color: #333; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <img src="logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/45?text=RF'">
        <div class="titles">
            <span class="main-title">Residencial Francia</span>
            <span class="sub-title">Panel administrativo</span>
        </div>

        <div id="tabs-wrapper" class="tabs-container">
            <!-- Pestañas generadas dinámicamente -->
        </div>

        <div class="flex items-center gap-4 ml-4">
            <button id="admin-btn" class="hidden bg-orange-500 hover:bg-orange-400 text-white text-[10px] font-bold px-2 py-1 rounded">ADMIN</button>
            <button id="logout-btn" class="text-xs text-gray-400 hover:text-white uppercase">Salir</button>
        </div>
    </nav>

    <!-- VISOR DE PÁGINAS -->
    <iframe id="content-frame" src="about:blank"></iframe>

    <!-- LOGIN -->
    <div id="login-modal" class="modal active">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-black text-center text-gray-800 mb-6 uppercase tracking-widest">Acceso</h2>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Correo electrónico" class="w-full p-3 bg-gray-100 border-none rounded-lg focus:ring-2 focus:ring-blue-900 outline-none">
                <input type="password" id="password" placeholder="Contraseña" class="w-full p-3 bg-gray-100 border-none rounded-lg focus:ring-2 focus:ring-blue-900 outline-none">
                <button id="login-btn" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-black transition duration-300">Entrar</button>
            </div>
            <p id="error-msg" class="text-red-500 text-xs mt-4 text-center hidden">Credenciales inválidas o sin permisos.</p>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="admin-modal" class="modal">
        <div class="admin-box">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-2xl font-bold text-blue-900">Configuración de Links</h2>
                <button onclick="closeAdmin()" class="text-3xl text-gray-400 hover:text-black">&times;</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Crear/Actualizar Usuario -->
                <div class="space-y-4">
                    <h3 class="font-bold text-gray-600 uppercase text-xs tracking-wider">Paso 1: Datos de Usuario</h3>
                    <input type="text" id="target-uid" placeholder="Pegar UID de Firebase" class="w-full p-2 border rounded text-sm">
                    <input type="email" id="target-email" placeholder="Correo del usuario" class="w-full p-2 border rounded text-sm">
                    <select id="target-role" class="w-full p-2 border rounded text-sm">
                        <option value="user">Usuario Común</option>
                        <option value="admin">Administrador</option>
                    </select>
                    <button id="save-user-btn" class="w-full bg-green-600 text-white py-2 rounded text-sm font-bold">Guardar/Actualizar Usuario</button>
                    <p class="text-[10px] text-gray-400 italic mt-2">Nota: El UID se obtiene en Authentication dentro de Firebase Console.</p>
                </div>

                <!-- Asignar Links -->
                <div class="space-y-4 border-l pl-0 md:pl-8">
                    <h3 class="font-bold text-gray-600 uppercase text-xs tracking-wider">Paso 2: Agregar Pestaña</h3>
                    <input type="text" id="link-name" placeholder="Nombre de pestaña (ej: Cámaras)" class="w-full p-2 border rounded text-sm">
                    <input type="text" id="link-url" placeholder="URL (https://...)" class="w-full p-2 border rounded text-sm">
                    <button id="add-link-btn" class="w-full bg-blue-600 text-white py-2 rounded text-sm font-bold">Añadir a este usuario</button>
                </div>
            </div>

            <div id="user-list-admin" class="mt-8 space-y-2">
                <!-- Aquí se listarán los usuarios creados -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        // TUS NUEVAS CREDENCIALES
        const firebaseConfig = {
            apiKey: "AIzaSyCSYibsKaKd_2k31Rr8vjrdlWe9Ok3tw5c",
            authDomain: "residencial-francia.firebaseapp.com",
            projectId: "residencial-francia",
            storageBucket: "residencial-francia.firebasestorage.app",
            messagingSenderId: "180424236616",
            appId: "1:180424236616:web:da5e1c30e4f59dc353427d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userProfile = null;

        // --- MANEJO DE LOGIN ---
        document.getElementById('login-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    userProfile = userDoc.data();
                    document.getElementById('login-modal').classList.remove('active');
                    if (userProfile.role === 'admin') document.getElementById('admin-btn').classList.remove('hidden');
                    renderTabs(userProfile.links || []);
                } else {
                    alert("Acceso denegado: Usuario no registrado en la base de datos de Firestore.");
                    signOut(auth);
                }
            } else {
                document.getElementById('login-modal').classList.add('active');
                document.getElementById('admin-btn').classList.add('hidden');
                document.getElementById('tabs-wrapper').innerHTML = '';
                document.getElementById('content-frame').src = 'about:blank';
            }
        });

        // --- RENDERIZADO DE PESTAÑAS SOLAPADAS ---
        function renderTabs(links) {
            const wrapper = document.getElementById('tabs-wrapper');
            wrapper.innerHTML = '';
            
            // Invertimos el orden para que visualmente se sientan de derecha a izquierda
            links.forEach((link, i) => {
                const tab = document.createElement('div');
                tab.className = `tab ${i === 0 ? 'active' : ''}`;
                tab.innerText = link.title;
                tab.onclick = () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('content-frame').src = link.url;
                };
                wrapper.appendChild(tab);
            });

            if (links.length > 0) document.getElementById('content-frame').src = links[0].url;
        }

        // --- FUNCIONES ADMIN ---
        document.getElementById('admin-btn').onclick = () => {
            document.getElementById('admin-modal').classList.add('active');
            loadAdminUserList();
        };

        window.closeAdmin = () => document.getElementById('admin-modal').classList.remove('active');

        // Paso 1: Guardar Usuario en DB
        document.getElementById('save-user-btn').onclick = async () => {
            const uid = document.getElementById('target-uid').value;
            const email = document.getElementById('target-email').value;
            const role = document.getElementById('target-role').value;
            if(!uid || !email) return alert("UID y Email son obligatorios");

            await setDoc(doc(db, "users", uid), {
                email: email,
                role: role,
                links: []
            }, { merge: true });
            alert("Usuario guardado en base de datos.");
        };

        // Paso 2: Añadir Link a un Usuario
        document.getElementById('add-link-btn').onclick = async () => {
            const uid = document.getElementById('target-uid').value;
            const title = document.getElementById('link-name').value;
            const url = document.getElementById('link-url').value;
            if(!uid || !title || !url) return alert("Completa todos los campos del Paso 2");

            await updateDoc(doc(db, "users", uid), {
                links: arrayUnion({ title, url })
            });
            alert("Link añadido con éxito.");
        };

        function loadAdminUserList() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('user-list-admin');
                list.innerHTML = '<h4 class="text-xs font-bold text-gray-400 mb-2 uppercase">Usuarios Registrados:</h4>';
                snap.forEach(d => {
                    const u = d.data();
                    const item = document.createElement('div');
                    item.className = "flex justify-between p-2 bg-gray-50 rounded text-xs border cursor-pointer hover:bg-blue-50";
                    item.innerHTML = `<span><b>${u.email}</b> (${u.role})</span> <span>${u.links?.length || 0} links</span>`;
                    item.onclick = () => {
                        document.getElementById('target-uid').value = d.id;
                        document.getElementById('target-email').value = u.email;
                        document.getElementById('target-role').value = u.role;
                    };
                    list.appendChild(item);
                });
            });
        }

    </script>
</body>
</html>
