<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residencial Francia - Panel administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --navy: #001f3f;
            --tab-inactive: #003366;
            --tab-active: #f8fafc;
        }
        body { background-color: #f0f2f5; overflow: hidden; height: 100vh; display: flex; flex-direction: column; margin: 0; font-family: 'Segoe UI', sans-serif; }
        
        .navbar {
            background-color: var(--navy);
            height: 65px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            color: white;
            z-index: 50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo { height: 45px; margin-right: 15px; }
        .main-title { font-weight: 800; font-size: 1.2rem; }
        .sub-title { font-size: 0.7rem; color: #93c5fd; text-transform: uppercase; }

        .tabs-container {
            display: flex;
            flex-grow: 1;
            justify-content: flex-end;
            height: 100%;
            align-items: flex-end;
            padding-right: 10px;
        }

        .tab {
            background: var(--tab-inactive);
            color: #94a3b8;
            padding: 8px 30px;
            margin-right: -15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tab.active {
            background: var(--tab-active);
            color: var(--navy);
            z-index: 10;
            font-weight: bold;
        }

        #content-frame { width: 100%; flex-grow: 1; border: none; background: #ffffff; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .box { background: white; border-radius: 15px; width: 100%; max-width: 400px; padding: 25px; }
        .admin-box { max-width: 800px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <nav class="navbar">
        <img src="logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/45?text=RF'">
        <div class="flex flex-col min-w-[200px]">
            <span class="main-title">Residencial Francia</span>
            <span class="sub-title">Panel administrativo</span>
        </div>

        <div id="tabs-wrapper" class="tabs-container"></div>

        <div class="flex items-center gap-4 ml-4">
            <button id="admin-btn" class="hidden bg-orange-500 text-white text-[10px] font-bold px-2 py-1 rounded">ADMIN</button>
            <button id="logout-btn" class="text-xs text-gray-400 hover:text-white">SALIR</button>
        </div>
    </nav>

    <iframe id="content-frame" src="about:blank"></iframe>

    <!-- LOGIN / REGISTRO / INVITADO -->
    <div id="login-modal" class="modal active">
        <div class="box">
            <h2 id="auth-title" class="text-2xl font-black text-center mb-6 text-navy">ACCESO</h2>
            
            <div class="space-y-3">
                <input type="email" id="email" placeholder="Correo electrónico" class="w-full p-3 bg-gray-100 rounded-lg outline-none">
                <input type="password" id="password" placeholder="Contraseña" class="w-full p-3 bg-gray-100 rounded-lg outline-none">
                
                <div class="flex gap-2">
                    <button id="login-btn" class="flex-1 bg-blue-900 text-white py-3 rounded-lg font-bold text-sm">ENTRAR</button>
                    <button id="register-btn" class="flex-1 bg-gray-200 text-navy py-3 rounded-lg font-bold text-sm">REGISTRARSE</button>
                </div>

                <div class="relative py-4">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
                    <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-500">O también</span></div>
                </div>

                <button id="guest-btn" class="w-full border-2 border-navy text-navy py-3 rounded-lg font-bold hover:bg-navy hover:text-white transition">ENTRAR COMO INVITADO</button>
            </div>
            <p id="error-msg" class="text-red-500 text-xs mt-4 text-center hidden"></p>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="admin-modal" class="modal">
        <div class="box admin-box">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-navy">Administrar Usuarios</h2>
                <button onclick="closeAdmin()" class="text-2xl">&times;</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h3 class="font-bold text-xs mb-4 text-blue-800">1. SELECCIONAR USUARIO</h3>
                    <div id="user-list-admin" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>

                <div class="space-y-4">
                    <h3 class="font-bold text-xs text-blue-800">2. ASIGNAR LINKS A: <span id="selected-user-name" class="text-orange-600 underline">Nadie</span></h3>
                    <input type="hidden" id="target-uid">
                    <input type="text" id="link-name" placeholder="Nombre (ej: Cámaras)" class="w-full p-2 border rounded">
                    <input type="text" id="link-url" placeholder="URL (https://...)" class="w-full p-2 border rounded">
                    <button id="add-link-btn" class="w-full bg-blue-900 text-white py-2 rounded font-bold">AÑADIR PESTAÑA</button>
                    
                    <div class="mt-4">
                        <h4 class="text-[10px] font-bold">LINKS ACTUALES:</h4>
                        <div id="current-links-list" class="text-[10px] space-y-1 py-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSYibsKaKd_2k31Rr8vjrdlWe9Ok3tw5c",
            authDomain: "residencial-francia.firebaseapp.com",
            projectId: "residencial-francia",
            storageBucket: "residencial-francia.firebasestorage.app",
            messagingSenderId: "180424236616",
            appId: "1:180424236616:web:da5e1c30e4f59dc353427d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- AUTENTICACIÓN ---
        const showError = (msg) => {
            const e = document.getElementById('error-msg');
            e.innerText = msg; e.classList.remove('hidden');
            setTimeout(() => e.classList.add('hidden'), 4000);
        };

        // Login Tradicional
        document.getElementById('login-btn').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(err => showError("Error: " + err.message));
        };

        // Registro Nuevo
        document.getElementById('register-btn').onclick = () => {
            createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(err => showError("Error al registrar: " + err.message));
        };

        // Invitado (Anónimo)
        document.getElementById('guest-btn').onclick = () => {
            signInAnonymously(auth).catch(err => showError("Error invitado: " + err.message));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // --- LÓGICA DE USUARIO Y FIRESTORE ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Si el usuario no existe en la base de datos, lo creamos automáticamente
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        email: user.isAnonymous ? "Invitado" : user.email,
                        role: "user",
                        isAnonymous: user.isAnonymous,
                        links: []
                    });
                }

                // Recargar datos y mostrar interfaz
                const data = (await getDoc(userRef)).data();
                document.getElementById('login-modal').classList.remove('active');
                if (data.role === 'admin') document.getElementById('admin-btn').classList.remove('hidden');
                renderTabs(data.links || []);
            } else {
                document.getElementById('login-modal').classList.add('active');
                document.getElementById('admin-btn').classList.add('hidden');
                document.getElementById('tabs-wrapper').innerHTML = '';
            }
        });

        // --- PESTAÑAS ---
        function renderTabs(links) {
            const wrapper = document.getElementById('tabs-wrapper');
            wrapper.innerHTML = '';
            links.forEach((link, i) => {
                const tab = document.createElement('div');
                tab.className = `tab ${i === 0 ? 'active' : ''}`;
                tab.innerText = link.title;
                tab.onclick = () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('content-frame').src = link.url;
                };
                wrapper.appendChild(tab);
            });
            if (links.length > 0) document.getElementById('content-frame').src = links[0].url;
        }

        // --- ADMINISTRACIÓN ---
        document.getElementById('admin-btn').onclick = () => {
            document.getElementById('admin-modal').classList.add('active');
            loadUsers();
        };

        window.closeAdmin = () => document.getElementById('admin-modal').classList.remove('active');

        function loadUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('user-list-admin');
                list.innerHTML = '';
                snap.forEach(d => {
                    const u = d.data();
                    const btn = document.createElement('div');
                    btn.className = "p-2 bg-white border rounded text-[10px] cursor-pointer hover:bg-blue-100 flex justify-between";
                    btn.innerHTML = `<span>${u.email} ${u.isAnonymous ? '👤' : '📧'}</span> <b>${u.links.length} links</b>`;
                    btn.onclick = () => {
                        document.getElementById('target-uid').value = d.id;
                        document.getElementById('selected-user-name').innerText = u.email;
                        renderCurrentLinks(u.links);
                    };
                    list.appendChild(btn);
                });
            });
        }

        function renderCurrentLinks(links) {
            const div = document.getElementById('current-links-list');
            div.innerHTML = links.map(l => `• ${l.title} (${l.url.substring(0,20)}...)`).join('<br>');
        }

        document.getElementById('add-link-btn').onclick = async () => {
            const uid = document.getElementById('target-uid').value;
            const title = document.getElementById('link-name').value;
            const url = document.getElementById('link-url').value;
            if(!uid || !title || !url) return alert("Selecciona un usuario y llena los datos");

            await updateDoc(doc(db, "users", uid), {
                links: arrayUnion({ title, url })
            });
            alert("Pestaña añadida");
            document.getElementById('link-name').value = "";
            document.getElementById('link-url').value = "";
        };

    </script>
</body>
</html>
