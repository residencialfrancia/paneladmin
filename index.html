<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residencial Francia - Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --navy: #001f3f;
            --tab-inactive: #003366;
            --tab-active: #ffffff;
        }
        body { background-color: #f3f4f6; overflow: hidden; height: 100vh; display: flex; flex-direction: column; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        /* BARRA SUPERIOR */
        .navbar {
            background-color: var(--navy);
            height: auto;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            color: white;
            z-index: 50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        @media (min-width: 768px) {
            .navbar { flex-direction: row; height: 75px; padding: 0 20px; }
        }

        .brand-container {
            display: flex;
            align-items: center;
            padding: 10px;
            flex-shrink: 0;
        }

        .logo { height: 40px; margin-right: 12px; }
        
        /* PESTAÑAS SOLAPADAS CON SCROLL MÓVIL */
        .tabs-container {
            display: flex;
            flex-grow: 1;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none; /* Firefox */
            padding-top: 10px;
            align-items: flex-end;
            margin-left: 10px;
        }
        .tabs-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .tab {
            background: var(--tab-inactive);
            color: #94a3b8;
            padding: 8px 25px;
            margin-right: -12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            font-size: 0.8rem;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tab.active {
            background: var(--tab-active);
            color: var(--navy);
            z-index: 10;
            font-weight: bold;
        }

        /* IFRAME RESPONSIVO */
        #content-frame { width: 100%; flex-grow: 1; border: none; background: white; }

        /* MODALES RESPONSIVOS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal.active { display: flex; }
        .box { background: white; border-radius: 12px; width: 100%; max-width: 400px; padding: 25px; color: #1a202c; }
        .admin-box { max-width: 900px; height: 90vh; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="brand-container">
            <img src="logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/40?text=RF'">
            <div class="flex flex-col">
                <span id="nav-title" class="font-bold text-base md:text-lg leading-tight text-white">Residencial Francia</span>
                <span id="nav-subtitle" class="text-[10px] md:text-xs text-blue-300 font-medium uppercase tracking-wider">Panel administrativo</span>
            </div>
        </div>

        <div id="tabs-wrapper" class="tabs-container">
            <!-- Pestañas -->
        </div>

        <div class="flex items-center justify-between md:justify-end gap-3 p-2 md:p-0 bg-black/20 md:bg-transparent">
            <button id="admin-btn" class="hidden bg-orange-500 text-white text-[10px] font-bold px-3 py-1.5 rounded uppercase">Admin</button>
            <button id="logout-btn" class="text-[10px] text-gray-300 hover:text-white font-bold uppercase mr-4">Salir</button>
        </div>
    </nav>

    <iframe id="content-frame" src="about:blank"></iframe>

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="modal active">
        <div class="box shadow-2xl border border-gray-100">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-navy tracking-tight">ACCESO</h2>
                <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mt-1">Residencial Francia</p>
            </div>
            
            <div class="space-y-3">
                <button id="google-btn" class="w-full flex items-center justify-center gap-3 border border-gray-300 p-3 rounded-xl font-bold text-xs hover:bg-gray-50 transition shadow-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16">
                    CONTINUAR CON GOOGLE
                </button>

                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                    <div class="relative flex justify-center text-[9px] uppercase font-bold text-gray-400"><span class="bg-white px-2">O usar cuenta</span></div>
                </div>

                <input type="email" id="email" placeholder="Correo" class="w-full p-3 bg-gray-50 border rounded-xl outline-none text-sm">
                <input type="password" id="password" placeholder="Clave" class="w-full p-3 bg-gray-50 border rounded-xl outline-none text-sm">
                
                <div class="flex gap-2">
                    <button id="login-btn" class="flex-1 bg-blue-900 text-white py-3 rounded-xl font-bold text-xs">ENTRAR</button>
                    <button id="register-btn" class="flex-1 bg-gray-100 text-navy py-3 rounded-xl font-bold text-xs">REGISTRAR</button>
                </div>

                <button id="guest-btn" class="w-full bg-navy/5 text-navy py-3 rounded-xl font-bold text-[10px] uppercase hover:bg-navy hover:text-white transition">Entrar como invitado</button>
            </div>
            <p id="error-msg" class="text-red-500 text-[10px] mt-4 text-center font-bold hidden"></p>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="admin-modal" class="modal">
        <div class="box admin-box">
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <h2 class="text-xl font-bold text-navy">Consola Administrativa</h2>
                <button onclick="closeAdmin()" class="text-3xl">&times;</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto">
                <!-- LISTA DE USUARIOS -->
                <div class="bg-gray-50 p-4 rounded-xl">
                    <h3 class="font-bold text-[10px] mb-3 text-gray-400 uppercase tracking-widest">1. Usuarios</h3>
                    <div id="user-list-admin" class="space-y-2 overflow-y-auto pr-2"></div>
                </div>

                <!-- CONFIGURACIÓN -->
                <div class="space-y-5">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                        <h3 class="font-bold text-[10px] text-blue-800 uppercase mb-3 tracking-widest">2. Personalizar Barra (Header)</h3>
                        <input type="hidden" id="target-uid">
                        <p class="text-[10px] mb-1 font-bold">Título de la barra:</p>
                        <input type="text" id="edit-main-title" placeholder="Ej: Residencial Francia" class="w-full p-2 border rounded-lg text-xs mb-3">
                        <p class="text-[10px] mb-1 font-bold">Subtítulo de la barra:</p>
                        <input type="text" id="edit-sub-title" placeholder="Ej: Panel administrativo" class="w-full p-2 border rounded-lg text-xs">
                        <button id="save-header-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold text-[10px] mt-3 uppercase">Guardar Títulos</button>
                    </div>

                    <div class="bg-orange-50 p-4 rounded-xl border border-orange-100">
                        <h3 class="font-bold text-[10px] text-orange-800 uppercase mb-3 tracking-widest">3. Agregar Pestañas (Links)</h3>
                        <input type="text" id="link-name" placeholder="Nombre Pestaña" class="w-full p-2 border rounded-lg text-xs mb-2">
                        <input type="text" id="link-url" placeholder="URL (https://...)" class="w-full p-2 border rounded-lg text-xs mb-3">
                        <button id="add-link-btn" class="w-full bg-navy text-white py-2 rounded-lg font-bold text-[10px] uppercase">Añadir Link</button>
                    </div>

                    <div class="p-2">
                        <h4 class="text-[9px] font-black text-gray-400 uppercase">Links actuales:</h4>
                        <div id="current-links-list" class="text-[9px] space-y-1 text-gray-600 italic"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSYibsKaKd_2k31Rr8vjrdlWe9Ok3tw5c",
            authDomain: "residencial-francia.firebaseapp.com",
            projectId: "residencial-francia",
            storageBucket: "residencial-francia.firebasestorage.app",
            messagingSenderId: "180424236616",
            appId: "1:180424236616:web:da5e1c30e4f59dc353427d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const showError = (msg) => {
            const e = document.getElementById('error-msg');
            e.innerText = msg; e.classList.remove('hidden');
            setTimeout(() => e.classList.add('hidden'), 4000);
        };

        // --- AUTH ---
        document.getElementById('google-btn').onclick = () => signInWithPopup(auth, googleProvider).catch(e => showError(e.message));
        document.getElementById('login-btn').onclick = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(e => showError("Clave incorrecta"));
        document.getElementById('register-btn').onclick = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(e => showError("Error al registrar"));
        document.getElementById('guest-btn').onclick = () => signInAnonymously(auth).catch(e => showError("Habilita acceso anónimo en Firebase"));
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // --- MANEJO DE ESTADO ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        email: user.email || "Invitado",
                        role: "user",
                        mainTitle: "Residencial Francia",
                        subTitle: "Panel administrativo",
                        links: []
                    });
                }

                const data = (await getDoc(userRef)).data();
                document.getElementById('login-modal').classList.remove('active');
                
                // Actualizar Header
                document.getElementById('nav-title').innerText = data.mainTitle || "Residencial Francia";
                document.getElementById('nav-subtitle').innerText = data.subTitle || "Panel administrativo";
                
                if (data.role === 'admin') document.getElementById('admin-btn').classList.remove('hidden');
                renderTabs(data.links || []);
            } else {
                document.getElementById('login-modal').classList.add('active');
                document.getElementById('admin-btn').classList.add('hidden');
                document.getElementById('tabs-wrapper').innerHTML = '';
            }
        });

        function renderTabs(links) {
            const wrapper = document.getElementById('tabs-wrapper');
            wrapper.innerHTML = '';
            links.forEach((l, i) => {
                const tab = document.createElement('div');
                tab.className = `tab ${i === 0 ? 'active' : ''}`;
                tab.innerText = l.title;
                tab.onclick = () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('content-frame').src = l.url;
                };
                wrapper.appendChild(tab);
            });
            if (links.length > 0) document.getElementById('content-frame').src = links[0].url;
        }

        // --- ADMIN ---
        document.getElementById('admin-btn').onclick = () => {
            document.getElementById('admin-modal').classList.add('active');
            loadUsers();
        };

        window.closeAdmin = () => document.getElementById('admin-modal').classList.remove('active');

        function loadUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('user-list-admin');
                list.innerHTML = '';
                snap.forEach(d => {
                    const u = d.data();
                    const div = document.createElement('div');
                    div.className = "p-3 bg-white border rounded-xl text-[10px] cursor-pointer hover:border-blue-500 flex justify-between items-center transition shadow-sm";
                    div.innerHTML = `<div><b>${u.email}</b></div> <span class="bg-blue-100 text-blue-700 px-2 rounded">${u.links.length}</span>`;
                    div.onclick = () => {
                        document.getElementById('target-uid').value = d.id;
                        document.getElementById('edit-main-title').value = u.mainTitle || "";
                        document.getElementById('edit-sub-title').value = u.subTitle || "";
                        document.getElementById('selected-user-name').innerText = u.email;
                        document.getElementById('current-links-list').innerHTML = u.links.map(l => `• ${l.title}`).join('<br>');
                    };
                    list.appendChild(div);
                });
            });
        }

        document.getElementById('save-header-btn').onclick = async () => {
            const uid = document.getElementById('target-uid').value;
            if(!uid) return alert("Selecciona un usuario");
            await updateDoc(doc(db, "users", uid), {
                mainTitle: document.getElementById('edit-main-title').value,
                subTitle: document.getElementById('edit-sub-title').value
            });
            alert("Títulos actualizados");
        };

        document.getElementById('add-link-btn').onclick = async () => {
            const uid = document.getElementById('target-uid').value;
            const title = document.getElementById('link-name').value;
            const url = document.getElementById('link-url').value;
            if(!uid || !title || !url) return alert("Faltan datos");
            await updateDoc(doc(db, "users", uid), {
                links: arrayUnion({ title, url })
            });
            document.getElementById('link-name').value = "";
            document.getElementById('link-url').value = "";
            alert("Link añadido");
        };

    </script>
</body>
</html>
